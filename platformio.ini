; M5SpectrumAnalyzer — анализатор спектра на M5StickS3 (ESP32-S3-PICO-1-N8R8)

[env:sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; StickS3 несёт 8 МБ flash и 8 МБ октального PSRAM
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_8MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17

lib_deps = m5stack/M5Unified

monitor_speed = 115200

; Обработка звука не зависит от железа и тестируется на хосте
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
